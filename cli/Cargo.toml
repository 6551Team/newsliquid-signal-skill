[package]
name = "newsliquid-signal-cli"
version = "0.3.0"
edition = "2021"
description = "NewsLiquid signal source push CLI"
license = "MIT"

[dependencies]
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
